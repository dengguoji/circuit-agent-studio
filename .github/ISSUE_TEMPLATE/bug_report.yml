name: Bug report
description: Report a reproducible problem in Circuit Agent Studio.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include API keys, private prompts, context-history files, or user images.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest reproducible sequence.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Provider
      options:
        - Not provider-specific
        - Alibaba Cloud Model Studio
        - Volcano Engine Ark
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, Node.js version, browser, and model name.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed secrets and private user data from this report.
          required: true
